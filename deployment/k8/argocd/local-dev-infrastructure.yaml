apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-dev-infrastructure
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/commerce-stack-solutions/priceprovider.git'
    targetRevision: master
    path: deployment/k8/environments/local-dev
    helm:
      values: |
        gateway:
          enabled: false
        postgres:
          enabled: true
        keycloak:
          enabled: true
        priceprovider-service:
          enabled: false
        priceprovider-app:
          enabled: false
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: price-provider
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
