plugins {
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'io.commercestacksolutions.cdf-codegen'
}

group = 'io.commercestacksolutions.priceproviderservice'
version = '1.0.0'

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/snapshot' }
    maven { url 'https://repo.spring.io/milestone' }
}

dependencies {
    implementation project(':commons')
    implementation project(':corebusinessentities')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'com.h2database:h2:2.3.232'
    implementation 'org.postgresql:postgresql:42.7.5'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
    implementation 'com.flipkart.zjsonpatch:zjsonpatch:0.4.16'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

test {
    useJUnitPlatform()
}

// Exclude platform packages from priceprovider compilation to avoid duplicates
sourceSets {
    main {
        java {
            exclude 'io/commercestacksolutions/coreserviceapp/**'
            exclude 'io/commercestacksolutions/corebusinessentities/**'
        }
    }
}

project(':coreserviceapp') {
    afterEvaluate {
        sourceSets {
            main {
                java {
                    srcDir(rootProject.layout.buildDirectory.dir("generated/sources/cdf/java"))
                    exclude 'io/commercestacksolutions/corebusinessentities/**'
                    exclude 'io/commercestacksolutions/priceproviderservice/**'
                }
            }
        }
        compileJava.dependsOn(rootProject.tasks.named('generateClassesFromCDF'))
    }
}

project(':corebusinessentities') {
    afterEvaluate {
        sourceSets {
            main {
                java {
                    srcDir(rootProject.layout.buildDirectory.dir("generated/sources/cdf/java"))
                    exclude 'io/commercestacksolutions/coreserviceapp/**'
                    exclude 'io/commercestacksolutions/priceproviderservice/**'
                }
            }
        }
        compileJava.dependsOn(rootProject.tasks.named('generateClassesFromCDF'))
    }
}
