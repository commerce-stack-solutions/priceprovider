plugins {
    id 'java-library'
}

group = 'io.commercestacksolutions'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring dependencies required by commons
    compileOnly 'org.springframework.boot:spring-boot-starter-data-jpa:4.1.0'
    compileOnly 'org.springframework.boot:spring-boot-starter-webmvc:4.1.0'
    compileOnly 'org.springframework.boot:spring-boot-starter-security:4.1.0'

    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'jakarta.persistence:jakarta.persistence-api'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.slf4j:slf4j-api'

    // For QueryFiltering/SpecificationBuilder
    implementation 'org.springframework.data:spring-data-jpa:3.4.2'
    implementation 'org.springframework:spring-webmvc:7.0.0-M1'
    implementation 'org.springframework.security:spring-security-core:7.0.0-M1'

    testImplementation 'org.springframework.boot:spring-boot-starter-test:4.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test:4.1.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test:4.1.0'
}

test {
    useJUnitPlatform()
}
